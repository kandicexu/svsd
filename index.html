          const order = S.testRunning ? rs.map((r, k) => k) : rs.map((r, k) => k).sort((a, b) => (rs[a].state === 'pass') - (rs[b].state === 'pass'));
          return html`<div style="font-size: 13px; font-weight: 600; color: ${passed === rs.length ? '#3C6DB0' : '#22211F'}">${passed} of ${rs.length} passed${S.testRunning ? ' · running ' + done + '/' + rs.length + '…' : ''}</div>
          ${order.map(k => { const r = rs[k]; return html`<div key=${'t' + k} style=${'border-radius: 16px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; background: ' + (r.state === 'fail' || r.state === 'error' ? '#FBEAF0' : '#FDFCF9')}>
            <span style=${'flex: none; font-weight: 700; width: 14px; color: ' + (r.state === 'pass' ? '#3C6DB0' : r.state === 'waiting' ? '#AEA89D' : '#B83A2E')}>${r.state === 'pass' ? '✓' : r.state === 'waiting' ? '…' : '✗'}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 12px; color: #22211F; line-height: 1.35">${r.input}</span>
              ${r.state !== 'waiting' && html`<span style="font-size: 11px; color: #6E6A63">expected ${nm(r.expect)} · got ${nm(r.got)}</span>`}
            </span>
            ${r.data && r.state === 'fail' && html`<button type="button" onClick=${() => { this.clearTimers(); this.setState({ lastInput: r.input }); this.loadStory(r.data); }} style="flex: none; border: 1px solid #DDD6CA; background: #FFFFFF; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 600; color: #3A3835">open</button>`}
          </div>`; })}`;
        })()}
      </div>
      <div style="margin-top: auto; border-top: 1px solid #DDD6CA; padding-top: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; font-weight: 600; color: #22211F">saved examples · ${S.examples.length}</div>
        <div style="font-size: 12px">The 8 newest (blue) go into the AI's instructions.</div>
        ${S.examples.map((e, k) => html`<div key=${e.id} style="display: flex; align-items: center; gap: 8px; font-size: 13px">
          <span style=${'width: 8px; height: 8px; border-radius: 50%; flex: none; background: ' + (k < 8 ? '#22211F' : '#DDD6CA')} aria-hidden="true"></span>
          <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #22211F">${e.title || 'untitled'}</span>
          <span style="font-size: 12px; color: #6E6A63">${e.flag || 'none'}</span>
          <button type="button" class="icon-btn" onClick=${() => this.deleteExample(e.id)} aria-label=${'Delete ' + (e.title || 'example')} style="width: 32px; height: 32px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>`)}
      </div>
    </aside>`;
  }

  renderTorn(v) {
    const S = v.S;
    const picked = S.tornFeel ? this.faceById(S.tornFeel) : null;
    const before = S.before ? this.faceById(S.before.emo) : null;
    /* only point to 988 if they came in strong (4-5/5) or came in okay and are leaving worse */
    const needHelp = !!(picked && picked.id !== 'okay' && S.before && (S.before.level >= 4 || S.before.emo === 'okay'));
    const came = before ? 'came in ' + before.label + (S.before.level ? ' ' + S.before.level + '/5' : '') + ' · ' : '';
    return html`<div class="scr" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 28px; text-align: center; animation: afPop .5s ease both">
      <div class="h-hand" style="font-weight: 700; font-size: 42px">torn out.</div>
      <div style="font-size: 15px; line-height: 1.5">Nothing saved. It was only ever a draft.</div>
      ${S.tornTalk && (S.tornTalkOpen
        ? html`<div style="margin-top: 12px; width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 14px; line-height: 1.5; animation: afPop .25s ease both">
          <div class="h-hand" style="font-size: 22px; line-height: 1.15; color: #22211F">${S.tornTalk.picked ? "you said you could ask. here\u0027s a start." : 'a few ways to open it up'}</div>
          ${S.tornTalk.openers.map(o => html`<div class="h-hand" style="font-size: 20px; color: #3C6DB0">\u201c${o}\u201d</div>`)}
          <div>Not ready to bring it up? You could talk it through with someone you trust first.</div>
        </div>`
        : html`${S.tornTalk.wait && html`<div style="margin-top: 12px; font-size: 14px; line-height: 1.5; max-width: 300px">when you\u0027re calmer, these will still be here.</div>`}<button type="button" onClick=${() => this.setState({ tornTalkOpen: true })} style="margin-top: 12px; min-height: 44px; padding: 0 18px; border: 1.5px solid #22211F; border-radius: 999px; background: transparent; color: #22211F; font-size: 14px; font-weight: 600">help me figure out what to say</button>`)}
      ${!S.tornDone ? html`
        <div class="h-hand" style="margin-top: 22px; font-size: 22px; line-height: 1.15">how do you feel now that it's gone?</div>
        <div style="display: flex; gap: 4px; justify-content: center">
          ${AF_FACES.map(e => html`<button type="button" onClick=${() => {
            if (e.id !== 'okay') { this.setState({ tornFeel: e.id }); return; }
            v.goHome();
            this.showToast((came || '') + 'now okay');
          }} aria-pressed=${S.tornFeel === e.id} style=${'width: 50px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; padding: 4px 0; color: #3A3835; border-radius: 16px; border: 1.5px solid ' + (S.tornFeel === e.id ? '#3A3835' : 'transparent') + '; opacity: ' + (S.tornFeel && S.tornFeel !== e.id ? '.45' : '1')}>
            <svg width="44" height="44" viewBox="0 0 80 80" fill="none" stroke="#3A3835" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="40" cy="40" r="34" fill=${e.color} stroke="none"/>${e.brows && html`<path d=${e.brows}/>`}<path d=${e.eyes}/><path d=${e.mouth}/>${e.extra && html`<path d=${e.extra} stroke=${e.extraColor}/>`}</svg>
            <span style="font-size: 11px">${e.label}</span>
          </button>`)}
        </div>
        ${S.tornFeel && html`<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; animation: afPop .25s ease both">
          <div style="font-size: 13px">how strong?</div>
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 12px">a little</span>
            ${[1, 2, 3, 4, 5].map(n => html`<button type="button" aria-label=${'strength ' + n + ' of 5'} onClick=${() => {
              /* high emotion at the end gets the safety popup; otherwise straight home */
              if (n >= 4) { this.setState({ tornLevel: n, tornAlert: true }); return; }
              const f = this.faceById(S.tornFeel);
              v.goHome();
              this.showToast((came || '') + 'now ' + f.label + ' ' + n + '/5');
            }} style="width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #3A3835; padding: 0; background: transparent"></button>`)}
            <span style="font-size: 12px">a lot</span>
          </div>
        </div>`}
        <button type="button" class="btn-link" onClick=${v.goHome}>skip</button>` : html`
        ${picked && html`<div style="margin-top: 8px; font-size: 14px">${came}now ${picked.label}</div>`}
        ${picked && picked.id !== 'okay' && html`<div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; font-size: 14px; line-height: 1.5; max-width: 300px; animation: afPop .3s ease both">${needHelp ? 'Some nights take longer. That\u0027s okay.' : 'That\u0027s okay. It doesn\u0027t have to be gone tonight.'}</div>`}
        <button type="button" onClick=${v.goHome} style="margin-top: 8px; border: 0; background: #22211F; color: #FFFFFF; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 400">new page</button>`}
      ${S.tornAlert && html`<div style="position: absolute; inset: 0; z-index: 50; background: rgba(60,60,60,.45); display: flex; align-items: center; justify-content: center; padding: 24px; animation: afPop .25s ease both">
        <div role="alertdialog" aria-modal="true" aria-labelledby="af-alert-t" aria-describedby="af-alert-d" style="position: relative; width: 100%; background: #FFFFFF; border-radius: 24px; padding: 24px 22px 18px; display: flex; flex-direction: column; gap: 12px; text-align: left; box-shadow: 0 24px 50px -20px rgba(0,0,0,.45)">
          <div style="display: flex; justify-content: flex-end; margin: -14px -12px -10px 0"><button type="button" class="icon-btn tight" onClick=${() => { this.setState({ tornAlert: false }); v.goHome(); }} aria-label="Close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
          <div id="af-alert-t" class="h-hand" style="font-weight: 700; font-size: 28px; line-height: 1.1; color: #22211F">your safety is important.</div>
          <div id="af-alert-d" style="font-size: 14px; line-height: 1.5">If tonight still feels heavy, you don't have to sit with it alone. Please reach out to someone who can help.</div>
          <a href="tel:988" class="btn-primary" style="display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 400; letter-spacing: 0">call 988</a>
          <a href="sms:988" class="btn-quiet" style="display: flex; align-items: center; justify-content: center; text-decoration: none">text 988</a>
          <div style="font-size: 12px; text-align: center">in danger right now? call 911</div>
        </div>
      </div>`}
    </div>`;
  }

  renderCast(v) {
    const S = v.S;
    return html`<div class="scr" style="display: flex; flex-direction: column; padding-top: 58px">
      ${Nav('cast', v.goHome, v.goCast)}
      <div style="padding: 0 24px 18px; display: flex; flex-direction: column; gap: 4px">
        <h1 class="h-serif" style="margin: 0; font-weight: 400; font-size: 40px">characters</h1>
        <p style="margin: 0; font-size: 13px">who shows up in your replays</p>
      </div>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 20px 28px; align-content: start; overflow-y: auto">
        ${AF_CHARS.map((c, i) => {
          const n = (S.history[c.id] || []).length + (S.met[c.id] || 0);
          return html`<button type="button" onClick=${() => this.setState({ screen: 'char', charIdx: i, expandedId: null })} aria-label=${c.name} style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px 12px; border: 0; border-radius: 24px; background: #FFFFFF; color: #3A3835">
            ${Art(c, 76)}
            <span class="h-hand" style="font-weight: 700; font-size: 22px; line-height: 1">${c.name}</span>
            <span style="font-size: 11px; font-weight: 600">${n ? 'met ' + n + '×' : 'not met yet'}</span>
          </button>`;
        })}
      </div>
    </div>`;
  }

  renderChar(v) {
    const S = v.S, ch = v.ch, C = ch.C;
    const n = AF_CHARS.length;
    return html`<div class="scr" style="display: flex; flex-direction: column; padding-top: 58px; overflow-y: auto">
      ${Nav('cast', v.goHome, v.goCast)}
      <button type="button" class="ch-info" onClick=${() => this.setState({ charInfo: true })} aria-label="What are these characters?" aria-haspopup="dialog"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/></svg></button>
      <div style="position: relative; height: 232px; display: flex; align-items: center; justify-content: center; flex: none; overflow: hidden">
        <div class="ch-car" onPointerDown=${e => { this.swipeX = e.clientX; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {} }} onPointerUp=${e => { if (this.swipeX == null) return; const dx = e.clientX - this.swipeX; this.swipeX = null; if (Math.abs(dx) > 40) this.setState({ charIdx: (S.charIdx + (dx < 0 ? 1 : n - 1)) % n, expandedId: null }); }} onPointerCancel=${() => { this.swipeX = null; }}>
          ${AF_CHARS.map((c, i) => { let off = ((i - S.charIdx) % n + n) % n; if (off > n / 2) off -= n; const a = Math.abs(off);
            return html`<div key=${c.id} class="ch-car-item" aria-hidden=${off ? 'true' : null} style=${'transform: translateX(-50%) translateX(' + (off * 61) + '%) translateY(' + Math.round((1 - (AF_CAROUSEL_SCALE[c.id] || 1)) * 112 * (off ? 0.49 : 1)) + 'px) scale(' + ((off ? 0.49 : 1) * (AF_CAROUSEL_SCALE[c.id] || 1)) + '); opacity: ' + (a === 0 ? 1 : a === 1 ? 0.16 : 0)}>${Art(c, 224, off ? null : c.name, true)}</div>`; })}
        </div>
        <button type="button" onClick=${() => this.setState({ charIdx: (S.charIdx + n - 1) % n, expandedId: null, freqInfo: false })} aria-label="Previous character" class="ch-arrow" style="position: absolute; left: 10px; top: 94px; width: 44px; height: 44px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" onClick=${() => this.setState({ charIdx: (S.charIdx + 1) % n, expandedId: null, freqInfo: false })} aria-label="Next character" class="ch-arrow" style="position: absolute; right: 10px; top: 94px; width: 44px; height: 44px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div key=${'chi-' + C.id} style="padding: 10px 28px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: afSwap .35s ease-out both">
        <span style=${'display: inline-flex; align-items: center; box-sizing: border-box; min-height: 36px; padding: 0 14px; font-size: 15px; border-radius: 999px; color: #22211F; background: ' + AF_FAMILY_TINT[C.family]}>${C.family.replace(/^a /, '')}</span>
        <h1 class="h-hand" style="margin: 0; font-weight: 700; font-size: 40px; line-height: 1; color: #22211F">${C.name}</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; max-width: 310px">${C.def}</p>
      </div>
      <div key=${'chc-' + C.id} class="ch-card">
        <div class="ch-row"><div class="ch-lbl">sounds like</div><div class="ch-val">\u201c${C.ex}\u201d</div></div>
        <div class="ch-row"><div class="ch-lbl">try asking</div><div class="ch-val">${C.tip.charAt(0).toUpperCase() + C.tip.slice(1)}</div></div>
        <div class="ch-row">
          <div style="display: flex; align-items: center; gap: 2px">
            <div class="ch-lbl" id="af-freq-l">frequency</div>
            <span class="ch-freq-wrap">
            ${S.freqInfo && html`<div id="af-freq-note" role="tooltip" class="ch-pop">${ch.fine}</div>`}
            <button type="button" class="ch-freq-i" onClick=${() => this.setState({ freqInfo: !S.freqInfo })} onKeyDown=${e => { if (e.key === 'Escape') this.setState({ freqInfo: false }); }} onBlur=${() => this.setState({ freqInfo: false })} aria-expanded=${!!S.freqInfo} aria-describedby=${S.freqInfo ? 'af-freq-note' : null} aria-label="About frequency"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/></svg></button>
            </span>
          </div>
          <div class="ch-val"><b>${ch.count}</b> ${ch.count === 1 ? 'time' : 'times'}</div>
        </div>
        ${ch.items.map(h => html`<div key=${h.id} style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid #DDD6CA">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="flex: none; width: 46px; font-size: 11px; font-weight: 600; color: #6E6A63">${h.date}</span>
            ${h.hasOutcome ? html`<button type="button" onClick=${h.toggle} aria-expanded=${h.open} style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 0; min-height: 36px; text-align: left; font-size: 14px; color: #22211F">
                ${Check}<span style="flex: 1">${h.outcome}</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6A63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style=${'flex: none; transition: transform .2s; transform: rotate(' + (h.open ? 180 : 0) + 'deg)'}><path d="M6 9l6 6 6-6"/></svg>
              </button>` : html`<span style="flex: 1; min-width: 0; font-size: 14px; color: #6E6A63">${h.title}</span>
              <button type="button" onClick=${h.ask} style="flex: none; font-size: 12px; font-weight: 600; border: 1px dashed #AEA89D; border-radius: 999px; padding: 8px 12px; background: transparent; color: #3A3835">what happened?</button>`}
          </div>
          ${h.open && html`<div style="padding-left: 56px; display: flex; flex-direction: column; gap: 2px; animation: afPop .25s ease both">
            <span style="font-size: 12px; color: #6E6A63">${h.title}</span>
            <span class="h-hand" style="font-size: 20px; line-height: 1.25; color: #3C6DB0">${h.redraft}</span>
          </div>`}
        </div>`)}
      </div>
      <div style="flex-grow: 1; min-height: 24px"></div>
    </div>`;
  }

  renderFollow(v) {
    const S = v.S, f = v.fuFound;
    if (!f) return null;
    return html`<div class="scr" style="display: flex; flex-direction: column; padding-top: 58px">
      <div style="display: flex; align-items: center; justify-content: flex-end; padding: 0 12px">
        ${Close(v.goHome)}
      </div>
      <div style="padding: 12px 28px 0; display: flex; flex-direction: column; gap: 18px">
        <div style="font-size: 13px">you asked to check back ${f.item.when}</div>
        <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
          <div class="h-hand" style="font-weight: 700; font-size: 22px">${f.item.title}</div>
          <div style="font-size: 13px">you predicted</div>
          <div class="h-hand" style="font-size: 22px; color: #3C6DB0">\u201c${f.item.prediction}\u201d</div>
        </div>
        <h1 class="h-serif" style="margin: 0; font-weight: 400; font-size: 42px; line-height: 1.1">how did it actually go?</h1>
        <div style="display: flex; flex-direction: column; gap: 10px">
          ${AF_OUTCOMES.map(l => html`<button type="button" onClick=${() => v.saveOutcome(l)} style="display: flex; align-items: center; min-height: 52px; padding: 0 18px; background: #FFFFFF; border: 1px solid #DDD6CA; border-radius: 16px; color: #22211F; font-size: 15px; text-align: left">${l}</button>`)}
          <div style="display: flex; gap: 8px; align-items: center">
            <input id="af-outcome" aria-label="In your own words" value=${S.outcomeText} onInput=${e => this.setState({ outcomeText: e.target.value })} placeholder="in my words…" style="flex: 1; min-width: 0; min-height: 52px; padding: 0 18px; border: 1px dashed #AEA89D; border-radius: 16px; background: transparent; font-size: 15px; color: #22211F; box-sizing: border-box"/>
            <button type="button" onClick=${() => { const t = (S.outcomeText || '').trim(); if (t) v.saveOutcome(t); }} style="min-height: 52px; border: 0; background: #22211F; color: #FFFFFF; border-radius: 16px; padding: 0 18px; font-weight: 400">save</button>
          </div>
        </div>
      </div>
      <div style="margin-top: auto; padding: 0 28px 44px; display: flex; align-items: center; gap: 10px; font-size: 13px">
        <span style=${'width: 22px; height: 22px; border-radius: 50%; background: ' + f.ch.color + '; flex: none'} aria-hidden="true"></span>
        Your answer goes on ${f.ch.name}'s page.
      </div>
    </div>`;
  }

  render() {
    const v = this.vals(), S = v.S;
    let screen = null;
    if (S.screen === 'home') screen = this.renderHome(v);
    else if (S.screen === 'listen') screen = this.renderListen(v);
    else if (S.screen === 'story' && v.st) screen = this.renderStory(v);
    else if (S.screen === 'torn') screen = this.renderTorn(v);
    else if (S.screen === 'cast') screen = this.renderCast(v);
    else if (S.screen === 'char') screen = this.renderChar(v);
    else if (S.screen === 'follow') screen = this.renderFollow(v);
    if (!screen) screen = this.renderHome(v);
    return html`<div class="frame">${screen}${S.peopleOpen && this.renderPeople()}${S.charInfo && S.screen === 'char' && this.renderCharInfo()}${S.toast && html`<div role="status" style="position: absolute; left: 24px; right: 24px; bottom: 108px; z-index: 40; background: #22211F; color: #FFFFFF; border-radius: 16px; padding: 12px 16px; font-size: 14px; text-align: center; animation: afPop .3s ease both">${S.toast}</div>`}</div>`;
  }
}

render(html`<${App} />`, document.getElementById('app'));
</script>
